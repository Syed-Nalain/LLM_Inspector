[project]
name = "llm-inspector"
version = "0.1.0"
description = "An agentic LLM security testing tool: your chosen LLM (Claude, GPT-4o, Gemini, or Ollama) reasons over authorized security tools (Garak, PyRIT, Promptfoo, guardrail checkers) via MCP to red-team and evaluate target LLM applications."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Talha ZBZ" }]

dependencies = [
    "mcp>=1.2.0",
    "typer>=0.12.0",
    "rich>=13.7.0",
    "pydantic>=2.7.0",
    "python-dotenv>=1.0.1",
    "httpx>=0.27.0",
    "PyYAML>=6.0.1",
]

[project.optional-dependencies]
anthropic = ["anthropic>=0.40.0"]
openai = ["openai>=1.30.0"]
gemini = ["google-genai>=1.0.0"]
all-providers = ["anthropic>=0.40.0", "openai>=1.30.0", "google-genai>=1.0.0"]
garak = ["garak>=0.10.0"]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "anthropic>=0.40.0",
]

[project.scripts]
llm-inspector = "llm_inspector.cli.main:app"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = [
    "slow: real end-to-end tests that shell out to garak/promptfoo and hit a local mock target (slower, needs those tools installed).",
]
