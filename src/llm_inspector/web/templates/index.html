<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LLM Inspector</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #0f1117; color: #e1e4e8; min-height: 100vh; }

  .header { background: #161b22; border-bottom: 1px solid #30363d; padding: 16px 24px; display: flex; align-items: center; gap: 12px; }
  .header h1 { font-size: 20px; font-weight: 600; }
  .header .badge { background: #238636; color: #fff; font-size: 11px; padding: 2px 8px; border-radius: 12px; }

  .container { max-width: 1000px; margin: 24px auto; padding: 0 24px; }

  .card { background: #161b22; border: 1px solid #30363d; border-radius: 8px; padding: 20px; margin-bottom: 16px; }
  .card h2 { font-size: 15px; font-weight: 600; margin-bottom: 12px; color: #58a6ff; }

  .mode-tabs { display: flex; gap: 0; margin-bottom: 16px; }
  .mode-tab { padding: 10px 20px; cursor: pointer; border: 1px solid #30363d; background: #0d1117; color: #8b949e; font-size: 14px; transition: all 0.2s; }
  .mode-tab:first-child { border-radius: 6px 0 0 6px; }
  .mode-tab:last-child { border-radius: 0 6px 6px 0; }
  .mode-tab.active { background: #1f6feb; color: #fff; border-color: #1f6feb; }

  select, input[type="text"], input[type="number"], textarea {
    width: 100%; padding: 8px 12px; background: #0d1117; border: 1px solid #30363d;
    border-radius: 6px; color: #e1e4e8; font-size: 14px; outline: none;
  }
  select:focus, input:focus, textarea:focus { border-color: #58a6ff; }
  textarea { resize: vertical; min-height: 80px; font-family: inherit; }

  label { font-size: 13px; color: #8b949e; display: block; margin-bottom: 4px; }
  .field { margin-bottom: 12px; }

  .vulns-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .vuln-item { display: flex; align-items: flex-start; gap: 8px; padding: 10px 12px; background: #0d1117; border: 1px solid #30363d; border-radius: 6px; cursor: pointer; transition: border-color 0.2s; }
  .vuln-item:hover { border-color: #58a6ff; }
  .vuln-item.checked { border-color: #58a6ff; background: #0d1b2e; }
  .vuln-item input[type="checkbox"] { margin-top: 2px; accent-color: #58a6ff; }
  .vuln-name { font-size: 13px; font-weight: 600; color: #e1e4e8; }
  .vuln-id { font-size: 12px; color: #58a6ff; margin-right: 6px; }
  .vuln-tools { font-size: 11px; color: #8b949e; margin-top: 2px; }

  .tools-row { display: flex; gap: 12px; flex-wrap: wrap; }
  .tool-chip { display: flex; align-items: center; gap: 6px; padding: 8px 14px; background: #0d1117; border: 1px solid #30363d; border-radius: 6px; cursor: pointer; font-size: 13px; transition: all 0.2s; }
  .tool-chip:hover { border-color: #58a6ff; }
  .tool-chip.checked { border-color: #58a6ff; background: #0d1b2e; }
  .tool-chip input[type="checkbox"] { accent-color: #58a6ff; }

  .btn { padding: 10px 24px; border: none; border-radius: 6px; font-size: 14px; font-weight: 600; cursor: pointer; transition: all 0.2s; }
  .btn-primary { background: #238636; color: #fff; }
  .btn-primary:hover { background: #2ea043; }
  .btn-primary:disabled { background: #21262d; color: #484f58; cursor: not-allowed; }

  .settings-row { display: flex; gap: 12px; }
  .settings-row .field { flex: 1; }

  #log-panel { display: none; }
  .log-box { background: #0d1117; border: 1px solid #30363d; border-radius: 6px; padding: 12px 16px; max-height: 350px; overflow-y: auto; font-family: 'Cascadia Code', 'Fira Code', monospace; font-size: 12px; line-height: 1.7; }
  .log-line { color: #8b949e; }
  .log-line.info { color: #58a6ff; }
  .log-line.success { color: #3fb950; }
  .log-line.error { color: #f85149; }

  #results-panel { display: none; }
  .findings-table { width: 100%; border-collapse: collapse; font-size: 13px; }
  .findings-table th { text-align: left; padding: 8px 12px; border-bottom: 2px solid #30363d; color: #8b949e; font-weight: 600; }
  .findings-table td { padding: 8px 12px; border-bottom: 1px solid #21262d; }
  .sev-CRITICAL { color: #f85149; font-weight: 700; }
  .sev-HIGH { color: #f85149; }
  .sev-MEDIUM { color: #d29922; }
  .sev-LOW { color: #58a6ff; }
  .sev-INFO { color: #8b949e; }

  .finding-detail { background: #0d1117; border: 1px solid #30363d; border-radius: 6px; padding: 14px; margin-top: 8px; margin-bottom: 12px; }
  .finding-detail h4 { font-size: 13px; color: #58a6ff; margin-bottom: 6px; }
  .finding-detail pre { font-size: 12px; color: #8b949e; white-space: pre-wrap; word-break: break-word; max-height: 120px; overflow-y: auto; }
  .finding-row { cursor: pointer; }
  .finding-row:hover td { background: #161b22; }

  .report-links { margin-top: 12px; font-size: 13px; }
  .report-links span { color: #8b949e; margin-right: 8px; }
  .report-links code { background: #21262d; padding: 2px 6px; border-radius: 4px; font-size: 12px; }

  .spinner { display: inline-block; width: 14px; height: 14px; border: 2px solid #30363d; border-top-color: #58a6ff; border-radius: 50%; animation: spin 0.8s linear infinite; margin-right: 8px; vertical-align: middle; }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>

<div class="header">
  <h1>LLM Inspector</h1>
  <span class="badge">Security Scanner</span>
</div>

<div class="container">
  <!-- Target Selection -->
  <div class="card">
    <h2>Target</h2>
    <div class="field">
      <select id="target-select">
        {% for t in targets %}
        <option value="{{ t.id }}">{{ t.name }} ({{ t.id }}) &mdash; {{ t.uri }}</option>
        {% endfor %}
        {% if not targets %}
        <option value="">No targets registered</option>
        {% endif %}
      </select>
    </div>
  </div>

  <!-- Target Details -->
  <div class="card">
    <h2>Target Details</h2>
    <div class="field">
      <label>Describe the target LLM application (helps generate more relevant attacks for promptfoo_redteam)</label>
      <textarea id="purpose-input" placeholder="e.g. A customer support chatbot for a banking application that handles account inquiries and transactions"></textarea>
    </div>
  </div>

  <!-- Scan Mode -->
  <div class="card">
    <h2>Scan Mode</h2>
    <div class="mode-tabs">
      <div class="mode-tab active" onclick="setMode('manual')">Manual (Checkboxes)</div>
      <div class="mode-tab" onclick="setMode('prompt')">Prompt (Brain LLM)</div>
    </div>

    <!-- Manual Mode -->
    <div id="manual-panel">
      <div class="field">
        <label>OWASP Vulnerabilities</label>
        <div class="vulns-grid">
          {% for cat in categories %}
          <div class="vuln-item" onclick="toggleVuln(this, '{{ cat.id }}')">
            <input type="checkbox" data-vuln="{{ cat.id }}">
            <div>
              <div class="vuln-name"><span class="vuln-id">{{ cat.id }}</span>{{ cat.name }}</div>
              <div class="vuln-tools">Tools: {{ cat.tools | join(', ') }}</div>
            </div>
          </div>
          {% endfor %}
        </div>
      </div>

      <div class="field" style="margin-top: 12px;">
        <label>Tools</label>
        <div class="tools-row">
          <div class="tool-chip" onclick="toggleTool(this, 'garak')">
            <input type="checkbox" data-tool="garak"> Garak
          </div>
          <div class="tool-chip" onclick="toggleTool(this, 'promptfoo')">
            <input type="checkbox" data-tool="promptfoo"> Promptfoo (Local)
          </div>
          <div class="tool-chip" onclick="toggleTool(this, 'promptfoo_redteam')">
            <input type="checkbox" data-tool="promptfoo_redteam"> Promptfoo Redteam (LLM)
          </div>
        </div>
      </div>

      <div class="settings-row" style="margin-top: 12px;">
        <div class="field">
          <label>Max Attempts (garak/promptfoo)</label>
          <input type="number" id="max-attempts" value="20" min="1" max="100">
        </div>
        <div class="field">
          <label>Num Tests (redteam)</label>
          <input type="number" id="num-tests" value="5" min="1" max="50">
        </div>
      </div>
    </div>

    <!-- Prompt Mode -->
    <div id="prompt-panel" style="display:none;">
      <div class="field">
        <label>Describe what to test (Brain LLM will plan and execute)</label>
        <textarea id="prompt-input" placeholder="e.g. Test for jailbreaks and prompt injection using 3 probes"></textarea>
      </div>
    </div>
  </div>

  <!-- Run Button -->
  <div style="text-align: right; margin-bottom: 16px;">
    <button class="btn btn-primary" id="run-btn" onclick="startScan()">Run Scan</button>
  </div>

  <!-- Logs -->
  <div class="card" id="log-panel">
    <h2><span class="spinner" id="log-spinner"></span>Scan Logs</h2>
    <div class="log-box" id="log-box"></div>
  </div>

  <!-- Results -->
  <div class="card" id="results-panel">
    <h2>Findings</h2>
    <div id="results-content"></div>
  </div>
</div>

<script>
let currentMode = 'manual';

function setMode(mode) {
  currentMode = mode;
  document.querySelectorAll('.mode-tab').forEach((tab, i) => {
    tab.classList.toggle('active', (i === 0 && mode === 'manual') || (i === 1 && mode === 'prompt'));
  });
  document.getElementById('manual-panel').style.display = mode === 'manual' ? 'block' : 'none';
  document.getElementById('prompt-panel').style.display = mode === 'prompt' ? 'block' : 'none';
}

function toggleVuln(el, id) {
  const cb = el.querySelector('input[type="checkbox"]');
  cb.checked = !cb.checked;
  el.classList.toggle('checked', cb.checked);
}

function toggleTool(el, name) {
  const cb = el.querySelector('input[type="checkbox"]');
  cb.checked = !cb.checked;
  el.classList.toggle('checked', cb.checked);
}

function startScan() {
  const targetId = document.getElementById('target-select').value;
  if (!targetId) { alert('Select a target first.'); return; }

  const btn = document.getElementById('run-btn');
  btn.disabled = true;
  btn.textContent = 'Scanning...';

  document.getElementById('log-panel').style.display = 'block';
  document.getElementById('results-panel').style.display = 'none';
  document.getElementById('log-box').innerHTML = '';
  document.getElementById('log-spinner').style.display = 'inline-block';

  const purpose = document.getElementById('purpose-input').value.trim();
  let body = { target_id: targetId, mode: currentMode };
  if (purpose) body.purpose = purpose;

  if (currentMode === 'manual') {
    const vulns = [];
    document.querySelectorAll('input[data-vuln]:checked').forEach(cb => vulns.push(cb.dataset.vuln));
    const tools = [];
    document.querySelectorAll('input[data-tool]:checked').forEach(cb => tools.push(cb.dataset.tool));
    if (!vulns.length || !tools.length) {
      alert('Select at least one vulnerability and one tool.');
      btn.disabled = false; btn.textContent = 'Run Scan';
      document.getElementById('log-panel').style.display = 'none';
      return;
    }
    body.vulns = vulns;
    body.tools = tools;
    body.max_attempts = parseInt(document.getElementById('max-attempts').value) || 20;
    body.num_tests = parseInt(document.getElementById('num-tests').value) || 5;
  } else {
    body.prompt = document.getElementById('prompt-input').value;
    if (!body.prompt.trim()) {
      alert('Enter a prompt.');
      btn.disabled = false; btn.textContent = 'Run Scan';
      document.getElementById('log-panel').style.display = 'none';
      return;
    }
  }

  fetch('/scan', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(body),
  })
  .then(r => r.json())
  .then(data => {
    if (data.error) { addLog(data.error, 'error'); return; }
    listenLogs(data.scan_id);
  })
  .catch(err => { addLog('Request failed: ' + err, 'error'); });
}

function listenLogs(scanId) {
  const es = new EventSource('/scan/' + scanId + '/stream');
  es.onmessage = function(e) {
    const data = JSON.parse(e.data);
    if (data.type === 'log') {
      let cls = 'info';
      const m = data.message;
      if (m.includes('Error') || m.includes('error') || m.includes('failed')) cls = 'error';
      else if (m.includes('complete') || m.includes('confirmed') || m.includes('hits')) cls = 'success';
      addLog(data.message, cls);
    } else if (data.type === 'error') {
      addLog(data.message, 'error');
    } else if (data.type === 'result') {
      showResults(data);
    } else if (data.type === 'done') {
      es.close();
      document.getElementById('log-spinner').style.display = 'none';
      document.getElementById('run-btn').disabled = false;
      document.getElementById('run-btn').textContent = 'Run Scan';
    }
  };
  es.onerror = function() {
    es.close();
    document.getElementById('log-spinner').style.display = 'none';
    document.getElementById('run-btn').disabled = false;
    document.getElementById('run-btn').textContent = 'Run Scan';
  };
}

function addLog(msg, cls) {
  const box = document.getElementById('log-box');
  const line = document.createElement('div');
  line.className = 'log-line ' + (cls || '');
  const ts = new Date().toLocaleTimeString();
  line.textContent = '[' + ts + '] ' + msg;
  box.appendChild(line);
  box.scrollTop = box.scrollHeight;
}

function showResults(data) {
  document.getElementById('results-panel').style.display = 'block';
  const container = document.getElementById('results-content');

  if (!data.findings || data.findings.length === 0) {
    container.innerHTML = '<p style="color:#8b949e;">No vulnerabilities found.</p>';
  } else {
    let html = '<table class="findings-table"><thead><tr><th>Severity</th><th>Vulnerability</th><th>OWASP</th><th>Confidence</th><th>Tool</th></tr></thead><tbody>';
    data.findings.forEach((f, i) => {
      html += '<tr class="finding-row" onclick="toggleDetail(' + i + ')">';
      html += '<td class="sev-' + f.severity + '">' + f.severity + '</td>';
      html += '<td>' + f.vulnerability + '</td>';
      html += '<td>' + f.owasp_id + '</td>';
      html += '<td>' + f.confidence + '</td>';
      html += '<td>' + f.tool + '</td>';
      html += '</tr>';
      html += '<tr id="detail-' + i + '" style="display:none;"><td colspan="5">';
      html += '<div class="finding-detail">';
      html += '<h4>Attack Payload</h4><pre>' + escHtml(f.attack) + '</pre>';
      html += '<h4 style="margin-top:10px;">Target Response</h4><pre>' + escHtml(f.response) + '</pre>';
      html += '<h4 style="margin-top:10px;">Recommended Mitigation</h4><pre>' + escHtml(f.mitigation) + '</pre>';
      html += '</div></td></tr>';
    });
    html += '</tbody></table>';
    container.innerHTML = html;
  }

  let links = '<div class="report-links"><span>Reports:</span>';
  links += '<code>' + data.report_md + '</code> ';
  links += '<code>' + data.report_json + '</code>';
  links += '</div>';
  container.innerHTML += links;
}

function toggleDetail(i) {
  const row = document.getElementById('detail-' + i);
  row.style.display = row.style.display === 'none' ? '' : 'none';
}

function escHtml(s) {
  const d = document.createElement('div');
  d.textContent = s || '';
  return d.innerHTML;
}
</script>
</body>
</html>
