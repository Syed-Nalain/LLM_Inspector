<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Scan {{ scan_id }} — LLM Inspector</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #0d1117; color: #c9d1d9; min-height: 100vh; }

  .header { background: #161b22; border-bottom: 1px solid #30363d; padding: 12px 24px; display: flex; align-items: center; gap: 12px; }
  .header h1 { font-size: 18px; font-weight: 600; color: #e6edf3; }
  .header .badge { background: #238636; color: #fff; font-size: 10px; padding: 2px 8px; border-radius: 12px; font-weight: 600; }
  .header nav { margin-left: auto; display: flex; gap: 20px; }
  .header nav a { color: #8b949e; text-decoration: none; font-size: 13px; font-weight: 500; transition: color 0.15s; }
  .header nav a:hover { color: #58a6ff; }

  .container { max-width: 1200px; margin: 0 auto; padding: 24px; }

  /* Breadcrumb */
  .breadcrumb { font-size: 12px; color: #8b949e; margin-bottom: 16px; }
  .breadcrumb a { color: #58a6ff; text-decoration: none; }
  .breadcrumb a:hover { text-decoration: underline; }

  /* Scan header */
  .scan-header {
    display: flex; align-items: center; gap: 12px; margin-bottom: 20px; flex-wrap: wrap;
  }
  .scan-title { font-size: 20px; font-weight: 700; color: #e6edf3; font-family: 'Cascadia Code', 'Fira Code', monospace; }
  .status-pill {
    display: inline-flex; align-items: center; gap: 5px;
    font-size: 11px; font-weight: 600; padding: 3px 10px; border-radius: 12px; text-transform: uppercase;
  }
  .st-completed { background: #0d3117; color: #3fb950; }
  .st-running { background: #1a1a00; color: #d29922; }
  .st-failed, .st-error { background: #2d1117; color: #f85149; }
  .scan-meta { font-size: 13px; color: #8b949e; }
  .scan-meta strong { color: #e6edf3; }

  /* Stats row */
  .stats-row {
    display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
    gap: 12px; margin-bottom: 24px;
  }
  .stat-box {
    background: #161b22; border: 1px solid #30363d; border-radius: 8px;
    padding: 16px; text-align: center;
  }
  .stat-val { font-size: 24px; font-weight: 700; color: #e6edf3; }
  .stat-lbl { font-size: 11px; color: #8b949e; text-transform: uppercase; letter-spacing: 0.5px; margin-top: 2px; }
  .stat-val.sev-crit { color: #f85149; }
  .stat-val.sev-high { color: #db6d28; }
  .stat-val.clean { color: #3fb950; }

  /* Tabs */
  .tabs {
    display: flex; gap: 0; border-bottom: 2px solid #21262d; margin-bottom: 20px;
  }
  .tab {
    padding: 10px 18px; cursor: pointer; font-size: 13px; font-weight: 500;
    color: #8b949e; border-bottom: 2px solid transparent; margin-bottom: -2px;
    transition: all 0.15s;
  }
  .tab:hover { color: #e6edf3; }
  .tab.active { color: #58a6ff; border-bottom-color: #58a6ff; }
  .tab .tab-count {
    background: #30363d; color: #8b949e; font-size: 10px; font-weight: 600;
    padding: 1px 7px; border-radius: 10px; margin-left: 6px;
  }
  .tab.active .tab-count { background: #0d419d; color: #c8d1d9; }
  .tab-panel { display: none; }
  .tab-panel.active { display: block; }

  /* --- Evidence & Probes tab --- */
  .probe-table { width: 100%; border-collapse: collapse; margin-bottom: 16px; }
  .probe-table th {
    text-align: left; padding: 8px 12px; font-size: 11px; font-weight: 600;
    color: #8b949e; text-transform: uppercase; letter-spacing: 0.5px;
    border-bottom: 1px solid #30363d; background: #161b22;
  }
  .probe-table td { padding: 10px 12px; font-size: 13px; border-bottom: 1px solid #21262d; }
  .probe-table tbody tr { cursor: pointer; transition: background 0.1s; }
  .probe-table tbody tr:hover { background: #161b22; }
  .probe-name { font-weight: 600; color: #e6edf3; }
  .probe-tool { font-size: 11px; color: #8b949e; background: #21262d; padding: 2px 8px; border-radius: 4px; }
  .asr-bar-wrap { display: flex; align-items: center; gap: 8px; }
  .asr-bar { width: 60px; height: 6px; background: #21262d; border-radius: 3px; overflow: hidden; }
  .asr-bar-fill { height: 100%; border-radius: 3px; }
  .asr-pct { font-size: 12px; font-weight: 600; font-family: monospace; min-width: 42px; }
  .asr-0 { color: #3fb950; } .asr-0 .asr-bar-fill { background: #3fb950; }
  .asr-low { color: #d29922; } .asr-low .asr-bar-fill { background: #d29922; }
  .asr-high { color: #f85149; } .asr-high .asr-bar-fill { background: #f85149; }

  /* Evidence expand */
  .evidence-panel { display: none; background: #0d1117; border: 1px solid #21262d; border-radius: 0 0 8px 8px; margin-top: -1px; margin-bottom: 12px; }
  .evidence-panel.open { display: block; }
  .evidence-panel-inner { padding: 16px; }

  .ev-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 12px; }
  @media (max-width: 800px) { .ev-grid { grid-template-columns: 1fr; } }

  .ev-section { }
  .ev-section h4 { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 6px; }
  .ev-section h4.h-attack { color: #f85149; }
  .ev-section h4.h-response { color: #58a6ff; }
  .ev-section pre {
    font-size: 12px; color: #c9d1d9; background: #161b22; border: 1px solid #30363d;
    border-radius: 6px; padding: 12px; white-space: pre-wrap; word-break: break-word;
    max-height: 200px; overflow-y: auto; line-height: 1.5;
  }

  .ev-item {
    border-bottom: 1px solid #21262d; padding: 12px 0;
  }
  .ev-item:last-child { border-bottom: none; }
  .ev-item-header {
    display: flex; align-items: center; gap: 8px; margin-bottom: 8px;
  }
  .ev-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
  .ev-dot.hit { background: #f85149; }
  .ev-dot.miss { background: #3fb950; }
  .ev-verdict { font-size: 11px; font-weight: 700; text-transform: uppercase; }
  .ev-verdict.hit { color: #f85149; }
  .ev-verdict.miss { color: #3fb950; }
  .ev-detectors { font-size: 11px; color: #8b949e; margin-left: auto; }

  /* Arguments summary */
  .args-summary { font-size: 12px; color: #8b949e; margin-bottom: 12px; }
  .args-summary code {
    background: #21262d; padding: 2px 6px; border-radius: 4px;
    font-family: 'Cascadia Code', 'Fira Code', monospace; font-size: 11px; color: #c9d1d9;
  }

  /* Detector stats */
  .det-row { display: flex; align-items: center; gap: 8px; margin-bottom: 4px; font-size: 12px; }
  .det-name { color: #8b949e; flex: 1; }
  .det-stat { font-family: monospace; min-width: 60px; }
  .det-pass { color: #3fb950; }
  .det-fail { color: #f85149; }

  /* --- Findings tab --- */
  .finding-card {
    background: #161b22; border: 1px solid #30363d; border-radius: 8px;
    margin-bottom: 12px; overflow: hidden;
  }
  .finding-header {
    padding: 14px 16px; cursor: pointer; display: flex; align-items: center; gap: 12px;
    transition: background 0.15s;
  }
  .finding-header:hover { background: #1c2128; }
  .finding-sev { font-size: 11px; font-weight: 700; padding: 3px 10px; border-radius: 6px; white-space: nowrap; }
  .sev-CRITICAL { background: #3d0d0d; color: #f85149; }
  .sev-HIGH { background: #3d1d0d; color: #db6d28; }
  .sev-MEDIUM { background: #3d2d0d; color: #d29922; }
  .sev-LOW { background: #0d2d3d; color: #58a6ff; }
  .sev-INFO { background: #21262d; color: #8b949e; }
  .finding-title { font-size: 14px; font-weight: 600; color: #e6edf3; flex: 1; }
  .finding-conf { font-size: 12px; color: #8b949e; font-family: monospace; }
  .finding-tool-badge { font-size: 11px; color: #8b949e; background: #21262d; padding: 2px 8px; border-radius: 4px; }
  .finding-chevron { color: #484f58; font-size: 10px; transition: transform 0.2s; }
  .finding-card.open .finding-chevron { transform: rotate(90deg); }

  .finding-body { display: none; padding: 0 16px 16px; border-top: 1px solid #21262d; }
  .finding-card.open .finding-body { display: block; }

  .f-section { margin-top: 12px; }
  .f-section h4 { font-size: 11px; color: #58a6ff; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 6px; font-weight: 600; }
  .f-section pre {
    font-size: 12px; color: #c9d1d9; background: #0d1117; border: 1px solid #30363d;
    border-radius: 6px; padding: 12px; white-space: pre-wrap; word-break: break-word;
    max-height: 200px; overflow-y: auto; line-height: 1.5;
  }
  .f-meta-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 8px; margin-top: 12px; }
  .f-meta-item { font-size: 12px; }
  .f-meta-item .f-label { color: #8b949e; }
  .f-meta-item .f-value { color: #e6edf3; font-weight: 500; }

  /* --- Log / Raw --- */
  .raw-box {
    background: #0d1117; border: 1px solid #30363d; border-radius: 6px;
    padding: 16px; font-family: 'Cascadia Code', 'Fira Code', monospace;
    font-size: 12px; line-height: 1.6; color: #8b949e; white-space: pre-wrap;
    word-break: break-word; max-height: 600px; overflow-y: auto;
  }
  .section-title { font-size: 13px; font-weight: 600; color: #58a6ff; margin: 16px 0 8px; }

  .no-data { text-align: center; padding: 40px; color: #8b949e; font-size: 13px; }
  .no-data.clean { color: #3fb950; }
  .loading { text-align: center; padding: 60px; color: #8b949e; font-size: 13px; }
  .spinner { display: inline-block; width: 18px; height: 18px; border: 2px solid #30363d; border-top-color: #58a6ff; border-radius: 50%; animation: spin 0.7s linear infinite; margin-right: 8px; vertical-align: middle; }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>

<div class="header">
  <h1>LLM Inspector</h1>
  <span class="badge">Security Scanner</span>
  <nav>
    <a href="/">New Scan</a>
    <a href="/history">History</a>
    <a href="/target/new">+ Target</a>
  </nav>
</div>

<div class="container">
  <div class="breadcrumb"><a href="/history">History</a> / <span id="bc-id">{{ scan_id }}</span></div>
  <div id="loading" class="loading"><span class="spinner"></span>Loading scan data...</div>
  <div id="content" style="display:none;">
    <div id="scan-header-area"></div>
    <div id="stats-area"></div>

    <div class="tabs" id="tab-bar"></div>
    <div class="tab-panel active" id="panel-evidence"></div>
    <div class="tab-panel" id="panel-findings"></div>
    <div class="tab-panel" id="panel-log"></div>
    <div class="tab-panel" id="panel-raw"></div>
  </div>
</div>

<script>
const SCAN_ID = "{{ scan_id }}";
let DATA = null;

fetch('/api/scan/' + SCAN_ID)
  .then(r => r.json())
  .then(data => {
    if (data.error) {
      document.getElementById('loading').innerHTML = '<p style="color:#f85149;">Scan not found.</p>';
      return;
    }
    DATA = data;
    document.getElementById('loading').style.display = 'none';
    document.getElementById('content').style.display = 'block';
    renderHeader();
    renderStats();
    renderTabs();
    renderEvidence();
    renderFindings();
    renderLog();
    renderRaw();
  })
  .catch(err => {
    document.getElementById('loading').innerHTML = '<p style="color:#f85149;">Error: ' + esc(String(err)) + '</p>';
  });

function renderHeader() {
  const s = DATA.scan;
  const started = new Date(s.started_at).toLocaleString();
  document.getElementById('scan-header-area').innerHTML = `
    <div class="scan-header">
      <span class="scan-title">${esc(s.id)}</span>
      <span class="status-pill st-${s.status}">${s.status}</span>
    </div>
    <div class="scan-meta" style="margin-bottom:20px;">
      Target: <strong>${esc(s.target_name)}</strong> &nbsp;&middot;&nbsp; ${started}
    </div>`;
}

function renderStats() {
  const u = DATA.usage || {};
  const fCount = DATA.findings.length;
  const elapsed = u.elapsed_seconds ? formatDuration(u.elapsed_seconds) : '—';
  const sevCounts = { CRITICAL: 0, HIGH: 0, MEDIUM: 0, LOW: 0 };
  DATA.findings.forEach(f => {
    const sv = (f.severity || 'INFO').toUpperCase();
    if (sevCounts[sv] !== undefined) sevCounts[sv]++;
  });

  const valClass = fCount === 0 ? 'clean' : sevCounts.CRITICAL > 0 ? 'sev-crit' : sevCounts.HIGH > 0 ? 'sev-high' : '';

  document.getElementById('stats-area').innerHTML = `
    <div class="stats-row">
      <div class="stat-box">
        <div class="stat-val ${valClass}">${fCount}</div>
        <div class="stat-lbl">Findings</div>
      </div>
      <div class="stat-box">
        <div class="stat-val">${u.tool_calls_made || 0}</div>
        <div class="stat-lbl">Probes Run</div>
      </div>
      <div class="stat-box">
        <div class="stat-val">${elapsed}</div>
        <div class="stat-lbl">Duration</div>
      </div>
      <div class="stat-box">
        <div class="stat-val">$${(u.estimated_usd_spent || 0).toFixed(4)}</div>
        <div class="stat-lbl">Cost</div>
      </div>
    </div>`;
}

function renderTabs() {
  const fCount = DATA.findings.length;
  const tcCount = DATA.tool_calls.length;
  document.getElementById('tab-bar').innerHTML = `
    <div class="tab active" onclick="switchTab('evidence', this)">Evidence & Probes<span class="tab-count">${tcCount}</span></div>
    <div class="tab" onclick="switchTab('findings', this)">Findings<span class="tab-count">${fCount}</span></div>
    <div class="tab" onclick="switchTab('log', this)">Scan Log</div>
    <div class="tab" onclick="switchTab('raw', this)">Raw Output</div>`;
}

function switchTab(name, el) {
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
  el.classList.add('active');
  document.getElementById('panel-' + name).classList.add('active');
}

function renderEvidence() {
  const panel = document.getElementById('panel-evidence');
  const calls = DATA.tool_calls || [];

  if (calls.length === 0) {
    panel.innerHTML = '<div class="no-data">No probes were executed in this scan.</div>';
    return;
  }

  let tableHTML = `<table class="probe-table"><thead><tr>
    <th style="width:30px;">#</th>
    <th>Probe</th>
    <th>Tool</th>
    <th style="text-align:center;">Attempts</th>
    <th style="text-align:center;">Hits</th>
    <th>ASR</th>
    <th style="text-align:center;">Status</th>
  </tr></thead><tbody>`;

  calls.forEach((tc, idx) => {
    const rd = tc.result_data;
    const isErr = tc.is_error || (rd && rd.error);
    const probe = rd ? (rd.probe || '') : '';
    const attempts = rd ? (rd.attempts || 0) : 0;
    const successful = rd ? (rd.successful || 0) : 0;
    const asr = rd ? (rd.asr || 0) : 0;
    const asrPct = (asr * 100).toFixed(0);
    const asrCls = asr === 0 ? 'asr-0' : asr > 0.3 ? 'asr-high' : 'asr-low';

    tableHTML += `<tr onclick="toggleEvidence(${idx})" id="probe-row-${idx}">
      <td style="color:#484f58; font-family:monospace; font-size:12px;">${tc.seq}</td>
      <td class="probe-name">${esc(probe || tc.tool_name)}</td>
      <td><span class="probe-tool">${esc(tc.tool_name.replace('run_', '').replace('_probe', '').replace('_test', ''))}</span></td>
      <td style="text-align:center; font-family:monospace; font-size:12px; color:#8b949e;">${isErr ? '—' : attempts}</td>
      <td style="text-align:center; font-family:monospace; font-size:12px; color:${successful > 0 ? '#f85149' : '#3fb950'};">${isErr ? '—' : successful}</td>
      <td>
        ${isErr ? '<span style="color:#8b949e;">—</span>' : `
        <div class="asr-bar-wrap ${asrCls}">
          <div class="asr-bar"><div class="asr-bar-fill" style="width:${asrPct}%;"></div></div>
          <span class="asr-pct">${asrPct}%</span>
        </div>`}
      </td>
      <td style="text-align:center;">${isErr ?
        '<span style="color:#f85149; font-size:11px; font-weight:600;">ERROR</span>' :
        (successful > 0 ?
          '<span style="color:#f85149; font-size:11px; font-weight:600;">FAIL</span>' :
          '<span style="color:#3fb950; font-size:11px; font-weight:600;">PASS</span>')
      }</td>
    </tr>`;

    tableHTML += `</tbody></table>`;
    // We'll build evidence panels separately
  });

  // Re-build: table rows + evidence panels after each row
  let html = `<table class="probe-table"><thead><tr>
    <th style="width:30px;">#</th>
    <th>Probe</th>
    <th>Tool</th>
    <th style="text-align:center;">Attempts</th>
    <th style="text-align:center;">Hits</th>
    <th>ASR</th>
    <th style="text-align:center;">Status</th>
  </tr></thead><tbody>`;

  calls.forEach((tc, idx) => {
    const rd = tc.result_data;
    const isErr = tc.is_error || (rd && rd.error);
    const probe = rd ? (rd.probe || '') : '';
    const attempts = rd ? (rd.attempts || 0) : 0;
    const successful = rd ? (rd.successful || 0) : 0;
    const asr = rd ? (rd.asr || 0) : 0;
    const asrPct = (asr * 100).toFixed(0);
    const asrCls = asr === 0 ? 'asr-0' : asr > 0.3 ? 'asr-high' : 'asr-low';

    html += `<tr onclick="toggleEvidence(${idx})" id="probe-row-${idx}" style="cursor:pointer;">
      <td style="color:#484f58; font-family:monospace; font-size:12px;">${tc.seq}</td>
      <td class="probe-name">${esc(probe || tc.tool_name)}</td>
      <td><span class="probe-tool">${esc(tc.tool_name.replace('run_', '').replace('_probe', '').replace('_test', ''))}</span></td>
      <td style="text-align:center; font-family:monospace; font-size:12px; color:#8b949e;">${isErr ? '—' : attempts}</td>
      <td style="text-align:center; font-family:monospace; font-size:12px; color:${successful > 0 ? '#f85149' : '#3fb950'};">${isErr ? '—' : successful}</td>
      <td>${isErr ? '<span style="color:#8b949e;">—</span>' : `
        <div class="asr-bar-wrap ${asrCls}">
          <div class="asr-bar"><div class="asr-bar-fill" style="width:${asrPct}%;"></div></div>
          <span class="asr-pct">${asrPct}%</span>
        </div>`}
      </td>
      <td style="text-align:center;">${isErr ?
        '<span style="color:#f85149; font-size:11px; font-weight:600;">ERROR</span>' :
        (successful > 0 ?
          '<span style="color:#f85149; font-size:11px; font-weight:600;">FAIL</span>' :
          '<span style="color:#3fb950; font-size:11px; font-weight:600;">PASS</span>')
      }</td>
    </tr>`;
  });

  html += '</tbody></table>';

  // Evidence panels (positioned below table, toggled per probe)
  calls.forEach((tc, idx) => {
    const rd = tc.result_data;
    const isErr = tc.is_error || (rd && rd.error);
    const evidence = rd ? (rd.evidence || []) : [];

    html += `<div class="evidence-panel" id="ev-panel-${idx}"><div class="evidence-panel-inner">`;

    // Args
    const args = tc.arguments || {};
    html += `<div class="args-summary">`;
    for (const [k, v] of Object.entries(args)) {
      html += `<code>${esc(k)}</code>: <span style="color:#e6edf3;">${esc(String(v))}</span> &nbsp;&nbsp;`;
    }
    html += `</div>`;

    // Error
    if (isErr && rd && rd.error) {
      html += `<div class="f-section"><h4 style="color:#f85149;">Error</h4><pre style="color:#f85149;">${esc(rd.error)}</pre></div>`;
      if (rd.log_tail) html += `<div class="f-section"><h4>Log Output</h4><pre>${esc(rd.log_tail)}</pre></div>`;
    }

    // Detectors
    if (rd && rd.detectors && rd.detectors.length > 0) {
      html += '<div style="margin-bottom:12px;"><div class="section-title" style="margin-top:0;">Detectors</div>';
      rd.detectors.forEach(det => {
        const total = det.total_evaluated || 0;
        const fails = det.fails || 0;
        const passed = total - fails;
        html += `<div class="det-row">
          <span class="det-name">${esc(det.detector)}</span>
          <span class="det-stat det-pass">${passed} pass</span>
          <span class="det-stat det-fail">${fails} fail</span>
          <span class="det-stat" style="color:#8b949e;">${total} total</span>
        </div>`;
      });
      html += '</div>';
    }

    // Evidence items
    if (evidence.length > 0) {
      html += `<div class="section-title">Evidence — ${evidence.length} prompt${evidence.length > 1 ? 's' : ''}</div>`;
      evidence.forEach((ev, eidx) => {
        const hit = ev.detector_hit;
        const detScores = ev.detector_results || {};
        let scoresStr = '';
        for (const [det, scores] of Object.entries(detScores)) {
          const vals = Array.isArray(scores) ? scores.map(s => s !== null ? s.toFixed(2) : 'null').join(', ') : String(scores);
          scoresStr += `${det.split('.').pop()}: ${vals}  `;
        }

        html += `<div class="ev-item">
          <div class="ev-item-header">
            <span class="ev-dot ${hit ? 'hit' : 'miss'}"></span>
            <span class="ev-verdict ${hit ? 'hit' : 'miss'}">${hit ? 'Vulnerability Detected' : 'Blocked'}</span>
            ${scoresStr ? `<span class="ev-detectors">${esc(scoresStr.trim())}</span>` : ''}
          </div>
          <div class="ev-grid">
            <div class="ev-section">
              <h4 class="h-attack">Attack Prompt</h4>
              <pre>${esc(ev.attack || '')}</pre>
            </div>
            <div class="ev-section">
              <h4 class="h-response">Target Response</h4>
              <pre>${esc(ev.response || '')}</pre>
            </div>
          </div>
        </div>`;
      });
    } else if (!isErr) {
      html += '<div class="no-data">No evidence transcripts available for this probe.</div>';
    }

    html += '</div></div>';
  });

  panel.innerHTML = html;
}

function toggleEvidence(idx) {
  const panel = document.getElementById('ev-panel-' + idx);
  const row = document.getElementById('probe-row-' + idx);
  const wasOpen = panel.classList.contains('open');
  // Close all
  document.querySelectorAll('.evidence-panel').forEach(p => p.classList.remove('open'));
  document.querySelectorAll('.probe-table tbody tr').forEach(r => r.style.background = '');
  if (!wasOpen) {
    panel.classList.add('open');
    row.style.background = '#161b22';
  }
}

function renderFindings() {
  const panel = document.getElementById('panel-findings');
  const findings = DATA.findings || [];

  if (findings.length === 0) {
    panel.innerHTML = '<div class="no-data clean">No confirmed vulnerabilities found in this scan.</div>';
    return;
  }

  let html = '';
  findings.forEach((f, idx) => {
    const sev = (f.severity || 'INFO').toUpperCase();
    const conf = ((f.confidence || 0) * 100).toFixed(0);

    html += `<div class="finding-card" id="f-${idx}">
      <div class="finding-header" onclick="toggleCard('f-${idx}')">
        <span class="finding-sev sev-${sev}">${sev}</span>
        <span class="finding-title">${esc(f.vulnerability)}</span>
        <span class="finding-conf">${conf}%</span>
        <span class="finding-tool-badge">${esc(f.source_tool)}</span>
        <span class="finding-chevron">&#9654;</span>
      </div>
      <div class="finding-body">
        <div class="ev-grid" style="margin-top:12px;">
          <div class="ev-section">
            <h4 class="h-attack">Attack Payload</h4>
            <pre>${esc(f.attack)}</pre>
          </div>
          <div class="ev-section">
            <h4 class="h-response">Target Response</h4>
            <pre>${esc(f.target_response)}</pre>
          </div>
        </div>
        <div class="f-meta-grid">
          <div class="f-meta-item"><span class="f-label">OWASP ID: </span><span class="f-value">${esc(f.owasp_id)}</span></div>
          <div class="f-meta-item"><span class="f-label">Technique: </span><span class="f-value">${esc(f.technique)}</span></div>
          <div class="f-meta-item"><span class="f-label">Reproducibility: </span><span class="f-value">${esc(f.reproducibility)}</span></div>
          <div class="f-meta-item"><span class="f-label">Validated: </span><span class="f-value">${f.validated_by_critic ? 'Yes (Critic LLM)' : 'No'}</span></div>
        </div>
        <div class="ev-grid" style="margin-top:12px;">
          <div class="f-section">
            <h4>Expected Behavior</h4>
            <pre>${esc(f.expected_behavior)}</pre>
          </div>
          <div class="f-section">
            <h4>Actual Behavior</h4>
            <pre>${esc(f.actual_behavior)}</pre>
          </div>
        </div>
        <div class="f-section">
          <h4>Recommended Mitigation</h4>
          <pre>${esc(f.recommended_mitigation)}</pre>
        </div>
        ${f.critic_notes ? `<div class="f-section"><h4>Critic Notes</h4><pre>${esc(f.critic_notes)}</pre></div>` : ''}
      </div>
    </div>`;
  });

  panel.innerHTML = html;
}

function renderLog() {
  const panel = document.getElementById('panel-log');
  const log = DATA.log_text || '';
  if (!log) {
    panel.innerHTML = '<div class="no-data">No scan log available.</div>';
    return;
  }
  panel.innerHTML = `<div class="raw-box">${esc(log)}</div>`;
}

function renderRaw() {
  const panel = document.getElementById('panel-raw');
  let html = '';

  html += '<div class="section-title">Tool Call Results</div>';
  (DATA.tool_calls || []).forEach(tc => {
    html += `<details style="margin-bottom:8px;">
      <summary style="cursor:pointer; font-size:13px; color:#e6edf3; padding:6px 0;">
        #${tc.seq} ${esc(tc.tool_name)} ${tc.is_error ? '<span style="color:#f85149;">(error)</span>' : ''}
      </summary>
      <pre class="raw-box" style="margin-top:4px; max-height:300px;">${esc(tc.result_text || '')}</pre>
    </details>`;
  });

  if (DATA.findings && DATA.findings.length > 0) {
    html += '<div class="section-title">Findings JSON</div>';
    html += `<pre class="raw-box">${esc(JSON.stringify(DATA.findings, null, 2))}</pre>`;
  }

  if (DATA.report_md) {
    html += '<div class="section-title">Report Markdown</div>';
    html += `<pre class="raw-box">${esc(DATA.report_md)}</pre>`;
  }

  panel.innerHTML = html;
}

function toggleCard(id) {
  document.getElementById(id).classList.toggle('open');
}

function formatDuration(sec) {
  if (!sec) return '—';
  if (sec < 60) return sec.toFixed(1) + 's';
  const m = Math.floor(sec / 60);
  const s = Math.round(sec % 60);
  return m + 'm ' + s + 's';
}

function esc(s) {
  const d = document.createElement('div');
  d.textContent = s || '';
  return d.innerHTML;
}
</script>
</body>
</html>
